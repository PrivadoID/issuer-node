# Default (secure) mode: ISSUER_UI_INSECURE is not "true".
# Everything except /health requires the UI login (ISSUER_UI_AUTH_USERNAME / ISSUER_UI_AUTH_PASSWORD), including the
# API proxy at /api/. The browser remembers the login and sends it with every request, so users enter it once.
server {
    listen 80;
    server_name localhost;

    auth_basic           "Restricted Content";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /health {
        auth_basic off;
        access_log off;
        add_header 'Content-Type' 'application/json';
        return 200 '{"status":"ok"}';
    }

    include /etc/nginx/issuer-ui-api-proxy.conf;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Redirect all requests to index.html
        try_files $uri /index.html =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
