# ###################################################################################################################
#  INSECURE MODE (ISSUER_UI_INSECURE=true) - FOR PUBLIC DEMOS ONLY
#
#  There is NO login. Anyone who can reach this server can use the UI and, through /api/, the whole issuer API:
#  this proxy adds the API credentials to every request. That means creating identities, issuing and revoking
#  credentials, and managing keys and payment options in this issuer's name.
#
#  The API password itself still stays on the server (it is not in the JS bundle), but that does not limit what
#  anyone can do through /api/. Never use this mode for an issuer with real users or real data.
# ###################################################################################################################
server {
    listen 80;
    server_name localhost;

    location /health {
        access_log off;
        add_header 'Content-Type' 'application/json';
        return 200 '{"status":"ok"}';
    }

    include /etc/nginx/issuer-ui-api-proxy.conf;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Redirect all requests to index.html
        try_files $uri /index.html =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
